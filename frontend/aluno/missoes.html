<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Trilha de Missões</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/missoes.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <h1>Trilha <span>de Missões</span></h1>
      <p class="subtitulo">Complete missões, ganhe XP e evolua na sua jornada do conhecimento!</p>

      <div class="busca">
        <div class="campo">
          <i data-icone="lupa" data-tam="20"></i>
          <input type="text" id="busca" placeholder="Buscar missão...">
        </div>
        <select id="categoria">
          <option value="">Todos os tipos</option>
          <option value="iniciante">Iniciante</option>
          <option value="intermediario">Intermediário</option>
          <option value="avancado">Avançado</option>
        </select>
        <select id="ordem">
          <option value="trilha">Ordem da trilha</option>
          <option value="maior">Maior XP</option>
          <option value="menor">Menor XP</option>
        </select>
        <div class="alternar">
          <button id="vGrade" class="ativa" title="Trilha"><i data-icone="grade" data-tam="20"></i></button>
          <button id="vLista" title="Lista"><i data-icone="lista" data-tam="20"></i></button>
        </div>
      </div>

      <div class="area-trilha">
        <div class="trilha" id="trilha"></div>
        <div class="estatisticas" id="resumo"></div>
      </div>
      <div class="paginas" id="paginas"></div>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/aluno-missoes.js"></script>
</body>
</html>
