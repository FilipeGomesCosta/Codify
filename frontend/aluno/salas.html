<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Salas de Aula</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/salas.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <h1>Salas <span>de Aula</span></h1>
      <p class="subtitulo">Acesse suas salas, participe das aulas e acompanhe suas atividades.</p>

      <div class="area-salas">
        <div>
          <div class="abas-salas">
            <button class="ativa">Minhas Salas</button>
            <button class="cinza" id="abrirEntrar">Entrar em Sala</button>
            <div class="campo">
              <i data-icone="lupa" data-tam="20"></i>
              <input type="text" id="busca" placeholder="Buscar sala...">
            </div>
          </div>
          <div id="lista"></div>
        </div>

        <div class="acoes-rapidas">
          <div class="cartao">
            <h2><i data-icone="raio" data-tam="26"></i> Ações Rápidas</h2>
            <button class="acao" id="acaoCodigo"><i data-icone="entrar" data-tam="30"></i><span><b>Entre com código</b><small>Entre em uma sala usando um código.</small></span><i data-icone="direita" data-tam="20"></i></button>
            <button class="acao" id="acaoPendentes"><i data-icone="prancheta" data-tam="30"></i><span><b>Atividades pendentes</b><small>Acompanhe suas tarefas.</small></span><i data-icone="direita" data-tam="20"></i></button>
            <button class="acao" id="acaoCalendario"><i data-icone="calendario" data-tam="30"></i><span><b>Calendário de aulas</b><small>Veja sua agenda.</small></span><i data-icone="direita" data-tam="20"></i></button>
          </div>
          <div class="cartao dica-codify">
            <div class="circulo-icone"><i data-icone="formatura" data-tam="30"></i></div>
            <div>
              <h2>Dica Codify</h2>
              <p>Participe das aulas para ganhar XP e evoluir na sua jornada!</p>
            </div>
          </div>
        </div>
      </div>

      <dialog id="janelaEntrar" class="acessar">
        <button class="fechar-dialogo" id="fecharEntrar" type="button"><i data-icone="fechar" data-tam="22"></i></button>
        <div class="circulo-icone"><i data-icone="entrar" data-tam="34"></i></div>
        <h3>Acessar Sala de Aula</h3>
        <p>Digite o código da sala que você deseja entrar.</p>
        <form id="formulario">
          <label for="codigo">Código da Sala:</label>
          <div class="campo-hash"><span><i data-icone="hash" data-tam="18"></i></span><input type="text" id="codigo" placeholder="Ex.: ABCD-1234"></div>
          <button type="submit">Entrar na Sala</button>
        </form>
      </dialog>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/aluno-salas.js"></script>
</body>
</html>
