<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Inventário</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/inventario.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <div class="titulo-icone"><i data-icone="mochila" data-tam="46"></i><h1>Inventário</h1></div>
      <p class="subtitulo">Veja e gerencie os itens que você conquistou nas suas missões.</p>

      <div class="barra-filtros">
        <div class="abas" id="abas">
          <button class="ativa" data-categoria="">Todos</button>
          <button data-categoria="Material">Materiais</button>
          <button data-categoria="Colecionável">Colecionáveis</button>
          <button data-categoria="Consumível">Consumíveis</button>
        </div>
        <select id="ordem">
          <option value="recentes">Mais recentes</option>
          <option value="nome">Nome (A-Z)</option>
          <option value="quantidade">Maior quantidade</option>
          <option value="raridade">Maior raridade</option>
        </select>
      </div>

      <div class="resumo" id="resumo"></div>
      <div class="grade-inventario" id="lista"></div>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/aluno-inventario.js"></script>
</body>
</html>
