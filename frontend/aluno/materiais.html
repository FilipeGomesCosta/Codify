<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Material de Apoio</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/materiais.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <h1>Material <span>de Apoio</span></h1>
      <p class="subtitulo">Acesse conteúdos e materiais que vão te ajudar na sua jornada.</p>

      <div class="busca">
        <div class="campo">
          <i data-icone="lupa" data-tam="20"></i>
          <input type="text" id="busca" placeholder="Buscar materiais...">
        </div>
        <select id="tipo">
          <option value="">Todos os tipos</option>
          <option value="documento">Documento</option>
          <option value="video">Vídeo</option>
          <option value="link">Link</option>
          <option value="imagem">Imagem</option>
          <option value="outro">Outro</option>
        </select>
        <select id="sala">
          <option value="">Todas as turmas</option>
        </select>
        <select id="ordem">
          <option value="recentes">Mais recentes</option>
          <option value="antigos">Mais antigos</option>
          <option value="titulo">Título (A-Z)</option>
        </select>
        <div class="alternar">
          <button id="vLista" class="ativa" title="Lista"><i data-icone="lista" data-tam="20"></i></button>
          <button id="vGrade" title="Grade"><i data-icone="grade" data-tam="20"></i></button>
        </div>
      </div>

      <div id="lista"></div>
      <div class="paginas" id="paginas"></div>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/aluno-materiais.js"></script>
</body>
</html>
