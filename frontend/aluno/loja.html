<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Loja</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/loja.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <div class="titulo-icone"><i data-icone="carrinho" data-tam="44"></i><h1>Loja</h1></div>
      <p class="subtitulo">Compre itens e recursos para te ajudar nas missões.</p>

      <div class="busca">
        <div class="campo">
          <i data-icone="lupa" data-tam="20"></i>
          <input type="text" id="busca" placeholder="Buscar item...">
        </div>
        <select id="tipo">
          <option value="">Todos os tipos</option>
          <option value="Auxílio">Auxílio</option>
          <option value="Missão">Missão</option>
          <option value="Recurso">Recurso</option>
        </select>
      </div>

      <div class="grade-itens" id="lista"></div>
      <div class="paginas" id="paginas"></div>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/aluno-loja.js"></script>
</body>
</html>
