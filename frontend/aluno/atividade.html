<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Atividade</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/formulario.css">
  <link rel="stylesheet" href="../assets/css/atividade.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <div class="pagina-form">
        <div class="coluna-principal">
          <div class="cabecalho-atividade">
            <div class="icone-doc grande"><i data-icone="arquivo" data-tam="40"></i></div>
            <div>
              <h1 id="titulo"></h1>
              <p class="subtitulo" id="professor" style="margin: 0"></p>
            </div>
          </div>
          <a href="#" class="voltar" id="voltar"><i data-icone="voltar" data-tam="20"></i> Voltar</a>

          <h3 class="secao-texto">Enunciado</h3>
          <div class="caixa-texto" id="enunciado"></div>
          <p id="anexo"></p>
        </div>

        <div class="coluna-lateral">
          <div class="card-lateral">
            <h2>Informações da atividade</h2>
            <div class="info-linha"><i data-icone="calendario" data-tam="34"></i><span><b>Data de entrega</b><small id="prazo"></small></span></div>
            <div class="info-linha"><i data-icone="trofeu" data-tam="34"></i><span><b>Pontuação final</b><small id="pontuacao"></small></span></div>
            <div class="info-linha"><i data-icone="relogio" data-tam="34"></i><span><b>Status atual</b><small id="status"></small></span></div>
          </div>

          <div class="card-lateral" id="blocoEntrega">
            <h2>Entrega da atividade</h2>
            <p class="cinza-texto" style="margin-top: 0">Anexe sua resposta ou arquivo</p>
            <div class="dropzone" id="zona">
            <p>Arraste e solte o arquivo aqui ou</p>
            <div class="linha-zona"><i data-icone="upload" data-tam="32"></i><button type="button" class="cinza">Selecionar Arquivo</button></div>
            <small>Formatos aceitos: PDF, DOCX, PPTX, MP4, PNG, JPG (Máx. 50MB)</small>
            <p class="nome-arquivo"></p>
            <input type="file" id="arquivo" hidden>
          </div>
            <label for="observacao">Observação (opcional)</label>
            <div class="contador">
              <textarea id="observacao" maxlength="300" placeholder="Escreva uma observação para o professor..."></textarea>
              <small id="contador">0/300</small>
            </div>
            <p id="aviso" class="alerta-prazo" hidden></p>
            <div class="botoes-form">
              <button type="button" class="cinza" id="rascunho"><i data-icone="marcador" data-tam="16"></i> Salvar rascunho</button>
              <button type="button" id="enviar"><i data-icone="enviar" data-tam="16"></i> Enviar a atividade</button>
            </div>
          </div>

          <div class="card-lateral">
            <h2>Histórico de entregas</h2>
            <div id="historico"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/aluno-atividade.js"></script>
</body>
</html>
