<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Salas de Aula</title>
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <link rel="stylesheet" href="../assets/css/salas.css">
</head>
<body>
  <div id="topo"></div>
  <div class="corpo">
    <div id="menu"></div>
    <main>
      <h1>Salas <span>de Aula</span></h1>
      <p class="subtitulo">Crie salas, acompanhe suas turmas e compartilhe o código com os alunos.</p>

      <div class="area-salas">
        <div>
          <div class="abas-salas">
            <button class="ativa">Minhas Salas</button>
            <a href="criar-sala.html" class="botao cinza"><i data-icone="mais" data-tam="18"></i> Criar Sala de Aula</a>
            <div class="campo">
              <i data-icone="lupa" data-tam="20"></i>
              <input type="text" id="busca" placeholder="Buscar sala...">
            </div>
          </div>
          <div id="lista"></div>
        </div>

        <div class="acoes-rapidas">
          <div class="cartao">
            <h2><i data-icone="raio" data-tam="26"></i> Ações Rápidas</h2>
            <a class="acao" href="criar-sala.html"><i data-icone="monitor" data-tam="30"></i><span><b>Criar sala de aula</b><small>Crie um espaço para sua turma.</small></span><i data-icone="direita" data-tam="20"></i></a>
            <a class="acao" href="material-novo.html"><i data-icone="livro" data-tam="30"></i><span><b>Adicionar material</b><small>Envie arquivos para os alunos.</small></span><i data-icone="direita" data-tam="20"></i></a>
          </div>
          <div class="cartao dica-codify">
            <div class="circulo-icone"><i data-icone="formatura" data-tam="30"></i></div>
            <div>
              <h2>Dica Codify</h2>
              <p>Compartilhe o código da sala para os alunos entrarem na turma.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/icones.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/topo.js"></script>
  <script src="../assets/js/prof-salas.js"></script>
</body>
</html>
