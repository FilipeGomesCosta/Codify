<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codify - Nova senha</title>
  <link rel="stylesheet" href="assets/css/estilo.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth">
    <div class="lado">
      <a href="index.html"><img src="assets/img/logo.png" alt="Codify"></a>
      <h1>Crie uma nova <span>senha.</span></h1>
      <p>Escolha uma senha com no mínimo 8 caracteres.</p>
    </div>
    <div class="linha-azul"></div>
    <div class="direita">
      <div class="cartao-auth">
        <div class="circulo"><i data-icone="cadeado" data-tam="34"></i></div>
        <h1>Nova senha</h1>
        <p>Crie a nova senha de acesso.</p>

        <form id="formulario">
          <label for="senha">Nova senha</label>
          <div class="campo">
            <i data-icone="cadeado" data-tam="20"></i>
            <input type="password" id="senha" placeholder="Mínimo de 8 caracteres">
          </div>

          <label for="confirmar">Confirmar senha</label>
          <div class="campo">
            <i data-icone="cadeado" data-tam="20"></i>
            <input type="password" id="confirmar" placeholder="Confirme sua senha">
          </div>

          <p id="mensagem" class="erro"></p>
          <button type="submit">Confirmar</button>
        </form>
      </div>
      <div class="rodape-auth">
        <span>© 2026 Codify. Todos os direitos reservados.</span>
        <span><a href="termos.html">Termos de Uso</a> &nbsp; <a href="termos.html">Política de Privacidade</a></span>
      </div>
    </div>
  </div>

  <script src="assets/js/icones.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/redefinir.js"></script>
</body>
</html>
